<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duality AI - Offroad Semantic Segmentation</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="header">
            <div class="logo-container">
                <div class="icon"></div>
                <h1>Duality AI Segmentation</h1>
            </div>
            <p class="subtitle">Pixel-perfect offroad scene understanding powered by DeepLabV3+</p>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Upload Section -->
            <section class="upload-section" id="drop-area">
                <form id="upload-form" class="upload-form">
                    <input type="file" id="fileElem" accept="image/*" class="file-input" hidden>
                    <label class="upload-btn" for="fileElem">
                        <div class="upload-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        </div>
                        <span id="upload-text">Drag & Drop an image or click to browse</span>
                    </label>
                </form>
                
                <div class="loader-container hidden" id="loader">
                    <div class="spinner"></div>
                    <p>Analyzing Terrain...</p>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section hidden" id="results-area">
                <div class="image-card">
                    <h3>Input Image</h3>
                    <div class="img-wrapper">
                        <img id="orig-img" src="" alt="Original Uploaded Image">
                    </div>
                </div>

                <div class="image-card glow-card">
                    <h3>Semantic Segmentation</h3>
                    <div class="img-wrapper">
                        <img id="pred-img" src="" alt="Predicted Segmentation Mask">
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Legend Section -->
        <footer class="legend">
            <h3>Class Legend</h3>
            <div class="legend-grid">
                <div class="legend-item"><div class="color-box" style="background: rgb(0, 128, 0);"></div> Trees</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(0, 255, 0);"></div> Lush Bushes</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(128, 128, 0);"></div> Dry Grass</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(165, 42, 42);"></div> Dry Bushes</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(210, 180, 140);"></div> Ground Clutter</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(255, 192, 203);"></div> Flowers</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(139, 69, 19);"></div> Logs</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(128, 128, 128);"></div> Rocks</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(244, 164, 96);"></div> Landscape</div>
                <div class="legend-item"><div class="color-box" style="background: rgb(135, 206, 235);"></div> Sky</div>
            </div>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
